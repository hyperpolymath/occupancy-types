# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
#
# Standalone Hypatia security scan (push / PR / weekly). This is NOT a duplicate
# of the `hypatia-scan` job in `static-analysis-gate.yml`: that job exists to
# feed the gitbot-fleet LEARNING pipeline (via `deposit-findings`), whereas this
# workflow is the repo's independent security scan. Same tool, two consumers.
# See .github/workflows/README.adoc.
name: Hypatia Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read      # required by the reusable workflow (staleness check reads workflow runs)
  contents: read
  security-events: write

jobs:
  hypatia:
    # secrets: inherit is required so HYPATIA_SCAN_PAT (org) reaches the
    # reusable. It does not, and cannot, cure a Hypatia *scanner build*
    # failure: this caller does not override hypatia-ref, so the reusable builds
    # the scanner from its pinned default commit, not HEAD (mix escript.build).
    # Scanner build failures are upstream failures, not consumer findings.
    # See docs/status/HYPATIA-GATE.adoc.
    uses: hyperpolymath/standards/.github/workflows/hypatia-scan-reusable.yml@94572e612a7bf11f8e6343d19adadf17ef2a3de3
    secrets: inherit
